<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 150" width="100%" height="150" fill="none">
  <defs>
    <!-- Executive Midnight Obsidian Background -->
    <linearGradient id="execBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0C1322" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Professional Studio Ambient Lights -->
    <radialGradient id="sapphireGlow" cx="22%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#1E3A8A" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="slateTealGlow" cx="78%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#0F766E" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070A10" stop-opacity="0" />
    </radialGradient>

    <!-- Premium Sapphire-to-Cobalt Vector Ribbon -->
    <linearGradient id="ribbonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#2563EB" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="1" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="secondaryRibbon" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#64748B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Hairline Structural Border -->
    <linearGradient id="execBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Micro Architectural Grid -->
    <pattern id="archGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-opacity="0.12" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .meta-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #94A3B8;
      letter-spacing: 2px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", Menlo, monospace;
      font-size: 10px;
      font-weight: 500;
      fill: #64748B;
      letter-spacing: 1px;
    }
  </style>

  <!-- Base Panel -->
  <rect x="1" y="1" width="848" height="148" rx="14" fill="url(#execBg)" stroke="url(#execBorder)" stroke-width="1" />
  <rect x="1" y="1" width="848" height="148" rx="14" fill="url(#archGrid)" />

  <!-- Studio Ambient Lighting Overlays -->
  <circle cx="200" cy="75" r="180" fill="url(#sapphireGlow)" />
  <circle cx="680" cy="75" r="180" fill="url(#slateTealGlow)" />

  <!-- Subtle Top Left Brand Indicator -->
  <g transform="translate(36, 30)">
    <circle cx="6" cy="6" r="3.5" fill="#38BDF8" />
    <circle cx="6" cy="6" r="7" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
    <text x="20" y="10" class="badge-label">ENGINEERING ARCHITECTURE</text>
  </g>

  <!-- Flowing Architectural Waves -->
  <path d="M 20 85 Q 220 25, 425 80 T 830 65" fill="none" stroke="url(#secondaryRibbon)" stroke-width="4" stroke-linecap="round" />
  <path d="M 20 65 Q 220 120, 425 70 T 830 75" fill="none" stroke="url(#ribbonGradient)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Multiplatform Connection Nodes -->
  <g transform="translate(230, 95)">
    <circle cx="0" cy="0" r="3" fill="#60A5FA" />
    <circle cx="0" cy="0" r="7" fill="none" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <g transform="translate(425, 70)">
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#60A5FA" stroke-width="1.2" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#1D4ED8" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 3" />
  </g>

  <g transform="translate(640, 80)">
    <circle cx="0" cy="0" r="3" fill="#38BDF8" />
    <circle cx="0" cy="0" r="7" fill="none" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <!-- Elegant Architectural Subtitle -->
  <g transform="translate(425, 126)">
    <text x="0" y="0" text-anchor="middle" class="meta-text">KOTLIN MULTIPLATFORM  •  COMPOSE  •  ANDROID ARCHITECTURE</text>
  </g>
</svg>