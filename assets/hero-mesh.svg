<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 130" width="100%" height="130" fill="none">
  <defs>
    <!-- Executive Obsidian Background -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#0A0D14" />
    </linearGradient>

    <!-- Hairline Structural Border -->
    <linearGradient id="hairlineBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262D" />
      <stop offset="50%" stop-color="#384252" />
      <stop offset="100%" stop-color="#21262D" />
    </linearGradient>

    <!-- Restrained Steel Accent Line -->
    <linearGradient id="steelLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#58A6FF" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#8B949E" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#30363D" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle Ambient Low-Key Glow -->
    <radialGradient id="subtleGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>

    <!-- Fine Engineering Dot Grid -->
    <pattern id="precisionGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8B949E" fill-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .code-font { font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", "SF Mono", Menlo, monospace; }
  </style>

  <!-- Base Panel -->
  <rect x="1" y="1" width="848" height="128" rx="12" fill="url(#obsidianBg)" stroke="url(#hairlineBorder)" stroke-width="1" />
  <rect x="1" y="1" width="848" height="128" rx="12" fill="url(#precisionGrid)" />
  <rect x="100" y="10" width="650" height="108" fill="url(#subtleGlow)" />

  <!-- Corner Precision Crosshairs -->
  <g stroke="#30363D" stroke-width="1">
    <line x1="16" y1="12" x2="16" y2="20" />
    <line x1="12" y1="16" x2="20" y2="16" />
    <line x1="834" y1="12" x2="834" y2="20" />
    <line x1="830" y1="16" x2="838" y2="16" />
    <line x1="16" y1="110" x2="16" y2="118" />
    <line x1="12" y1="114" x2="20" y2="114" />
    <line x1="834" y1="110" x2="834" y2="118" />
    <line x1="830" y1="114" x2="838" y2="114" />
  </g>

  <!-- Architectural Central Axis -->
  <line x1="40" y1="65" x2="810" y2="65" stroke="url(#steelLine)" stroke-width="1" />
  
  <!-- Subtle Multiplatform Architecture Nodes -->
  <g transform="translate(425, 65)">
    <circle cx="0" cy="0" r="4" fill="#C9D1D9" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#58A6FF" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#30363D" stroke-width="1" stroke-dasharray="2 3" />
  </g>

  <g transform="translate(230, 65)">
    <circle cx="0" cy="0" r="2.5" fill="#8B949E" />
    <circle cx="0" cy="0" r="6" fill="none" stroke="#30363D" stroke-width="1" />
  </g>

  <g transform="translate(620, 65)">
    <circle cx="0" cy="0" r="2.5" fill="#8B949E" />
    <circle cx="0" cy="0" r="6" fill="none" stroke="#30363D" stroke-width="1" />
  </g>

  <!-- Technical Spec Watermarks (Subtle Slate) -->
  <text x="32" y="32" class="code-font" font-size="10" fill="#484F58" letter-spacing="1.5">SYS.ARCH // KOTLIN_MULTIPLATFORM</text>
  <text x="735" y="32" class="code-font" font-size="10" fill="#484F58" letter-spacing="1.5">v2.0 // CMP</text>
  <text x="32" y="105" class="code-font" font-size="10" fill="#484F58" letter-spacing="1.2">TARGETS: ANDROID • IOS • DESKTOP • WASM</text>
  <text x="715" y="105" class="code-font" font-size="10" fill="#484F58" letter-spacing="1.2">STATUS: STABLE</text>
</svg>