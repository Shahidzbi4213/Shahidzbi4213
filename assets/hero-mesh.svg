<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <!-- Glowing Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F52FF" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#4F5BFF" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3DDC84" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="subtleRibbon" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3DDC84" stop-opacity="0.6" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowViolet" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7F52FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7F52FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowEmerald" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#3DDC84" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect x="1" y="1" width="848" height="158" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <rect x="1" y="1" width="848" height="158" rx="16" fill="url(#dotGrid)" />

  <!-- Ambient Glows -->
  <circle cx="180" cy="80" r="130" fill="url(#glowViolet)" />
  <circle cx="680" cy="80" r="140" fill="url(#glowEmerald)" />

  <!-- Secondary Ribbon Path -->
  <path d="M 0 100 Q 212 30, 425 90 T 850 60" fill="none" stroke="url(#subtleRibbon)" stroke-width="6" stroke-linecap="round" />

  <!-- Primary Glowing Vector Ribbon -->
  <path d="M 0 75 Q 212.5 135, 425 80 T 850 85" fill="none" stroke="url(#ribbonGrad)" stroke-width="3" stroke-linecap="round" filter="drop-shadow(0 0 10px rgba(127, 82, 255, 0.6))" />

  <!-- Constellation Nodes on Ribbon -->
  <circle cx="110" cy="95" r="4.5" fill="#7F52FF" />
  <circle cx="110" cy="95" r="9" fill="none" stroke="#7F52FF" stroke-opacity="0.5" stroke-width="1" />

  <circle cx="270" cy="115" r="3.5" fill="#4F5BFF" />
  <circle cx="270" cy="115" r="7" fill="none" stroke="#4F5BFF" stroke-opacity="0.4" stroke-width="1" />

  <circle cx="425" cy="80" r="6" fill="#FFFFFF" />
  <circle cx="425" cy="80" r="12" fill="none" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.5" />
  <circle cx="425" cy="80" r="18" fill="none" stroke="#7F52FF" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 2" />

  <circle cx="580" cy="68" r="3.5" fill="#38BDF8" />
  <circle cx="580" cy="68" r="7" fill="none" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />

  <circle cx="730" cy="80" r="5" fill="#3DDC84" />
  <circle cx="730" cy="80" r="10" fill="none" stroke="#3DDC84" stroke-opacity="0.6" stroke-width="1" />
</svg>