<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4F5BFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3DDC84" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ambient Mesh Glows -->
    <radialGradient id="glowLeft" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#7F52FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7F52FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3DDC84" stop-opacity="0" />
    </radialGradient>

    <!-- Pill Tag Background -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", Menlo, monospace; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-weight: 800; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; font-weight: 500; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", Menlo, monospace; font-size: 11px; font-weight: 600; fill: #CBD5E1; }
    .status-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #34D399; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    .pulse-dot { animation: pulse 2.5s infinite ease-in-out; }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="846" height="236" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="846" height="236" rx="20" fill="url(#grid)" />

  <!-- Ambient Glow Overlays -->
  <circle cx="120" cy="50" r="140" fill="url(#glowLeft)" filter="blur(20px)" />
  <circle cx="740" cy="180" r="160" fill="url(#glowRight)" filter="blur(25px)" />

  <!-- Status Indicator Pill -->
  <g transform="translate(48, 38)">
    <rect width="265" height="26" rx="13" fill="#064E3B" fill-opacity="0.45" stroke="#059669" stroke-opacity="0.6" stroke-width="1" />
    <circle class="pulse-dot" cx="15" cy="13" r="4.5" fill="#10B981" />
    <text x="28" y="17" class="status-text">Available for KMP &amp; Mobile Projects</text>
  </g>

  <!-- Main Hero Title -->
  <text x="48" y="112" class="title" font-size="44" fill="#FFFFFF" letter-spacing="-0.5">Shahid Iqbal</text>
  
  <!-- Senior Title with Gradient Accent -->
  <text x="48" y="146" class="subtitle" font-size="18" fill="url(#textGrad)" letter-spacing="0.2">Senior Kotlin Multiplatform &amp; Android Engineer</text>

  <!-- Tag Pills Row -->
  <g transform="translate(48, 175)">
    <!-- Pill 1: Compose Multiplatform -->
    <g transform="translate(0, 0)">
      <rect width="176" height="28" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#4F5BFF" />
      <text x="28" y="18" class="badge-text">Compose Multiplatform</text>
    </g>

    <!-- Pill 2: Jetpack Compose -->
    <g transform="translate(186, 0)">
      <rect width="138" height="28" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#4285F4" />
      <text x="28" y="18" class="badge-text">Jetpack Compose</text>
    </g>

    <!-- Pill 3: AGSL & Graphics -->
    <g transform="translate(334, 0)">
      <rect width="125" height="28" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#A855F7" />
      <text x="28" y="18" class="badge-text">AGSL Shaders</text>
    </g>

    <!-- Pill 4: Clean Architecture -->
    <g transform="translate(469, 0)">
      <rect width="150" height="28" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#10B981" />
      <text x="28" y="18" class="badge-text">Clean Architecture</text>
    </g>
  </g>

  <!-- Right Decorative Modern Isometric Kotlin/Mobile Emblem -->
  <g transform="translate(670, 45)" stroke-width="1.5">
    <!-- Outer Hex / Shield Frame -->
    <path d="M 60 15 L 115 45 L 115 110 L 60 140 L 5 110 L 5 45 Z" fill="#1E293B" fill-opacity="0.4" stroke="#4F5BFF" stroke-opacity="0.4" stroke-dasharray="3 3" />
    
    <!-- Stylized Kotlin / Multiplatform Geometry -->
    <polygon points="60,35 100,75 60,115 20,75" fill="none" stroke="url(#textGrad)" stroke-width="2" />
    <polygon points="60,48 87,75 60,102 33,75" fill="#7F52FF" fill-opacity="0.18" stroke="#3DDC84" stroke-width="1.5" />
    
    <!-- Central Node -->
    <circle cx="60" cy="75" r="7" fill="#3DDC84" />
    <circle cx="60" cy="75" r="14" fill="none" stroke="#3DDC84" stroke-opacity="0.4" stroke-width="1" />

    <!-- Corner Accents -->
    <circle cx="60" cy="35" r="3" fill="#7F52FF" />
    <circle cx="100" cy="75" r="3" fill="#38BDF8" />
    <circle cx="60" cy="115" r="3" fill="#A78BFA" />
    <circle cx="20" cy="75" r="3" fill="#3DDC84" />
  </g>
</svg>